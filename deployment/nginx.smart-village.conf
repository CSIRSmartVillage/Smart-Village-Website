server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # -----------------------------------------------------------------
    # API proxy — MUST come before the SPA catch-all.
    # All requests whose path starts with /api/ are forwarded to the
    # Express backend running on port 5000.  The trailing slash on
    # proxy_pass is intentionally omitted so Nginx passes the full
    # original URI (including /api/) to Express, which mounts its
    # router at app.use("/api", ...).
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive / WebSocket upgrade support
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Generous timeouts for slow MongoDB Atlas queries
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Disable buffering so streaming responses work correctly
        proxy_buffering off;
    }

    # -----------------------------------------------------------------
    # React Router SPA fallback — every non-file request returns
    # index.html so client-side routing works correctly.
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
